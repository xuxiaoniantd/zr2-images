name: Auto Cleanup Old Images

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete images older than 24 hours
        run: |
          CUTOFF=$(date -d '24 hours ago' +%s)
          if [ -d "images" ]; then
            for file in images/*; do
              if [ -f "$file" ]; then
                TIMESTAMP_MS=$(basename "$file" | cut -d'-' -f1)
                TIMESTAMP_SEC=$((TIMESTAMP_MS / 1000))
                if [ "$TIMESTAMP_SEC" -lt "$CUTOFF" ]; then
                  git rm "$file"
                  echo "Deleted: $file"
                fi
              fi
            done
          fi
          if git diff --cached --quiet; then
            echo "没有需要清理的文件"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto cleanup old images"
            git push
          fi
