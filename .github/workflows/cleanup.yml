name: Auto Cleanup Old Images
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Clear images folder
        run: rm -rf images/* || true
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto clean images folder"
