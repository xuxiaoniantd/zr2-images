name: Auto Cleanup Old Images

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: # 只允许定时或手动触发，绝不在上传时触发

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete images older than 2 hours
        run: |
          CUTOFF=$(date -d '2 hours ago' +%s)
          if [ -d "images" ]; then
            for file in images/*; do
              if [ -f "$file" ]; then
                TIMESTAMP_MS=$(basename "$file" | cut -d'-' -f1)
                # 安全检查：确保是纯数字才处理
                if [[ "$TIMESTAMP_MS" =~ ^[0-9]+$ ]]; then
                  TIMESTAMP_SEC=$((TIMESTAMP_MS / 1000))
                  if [ "$TIMESTAMP_SEC" -lt "$CUTOFF" ]; then
                    rm "$file"
                    echo "Deleted: $file"
                  fi
                fi
              fi
            done
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto cleanup old images"
          file_pattern: 'images/*'
